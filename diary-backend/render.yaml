services:
  - type: web
    name: diary-backend
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diary-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: diary-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: diary-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      # Set these two manually in the Render dashboard:
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: diary-db
    plan: free
