
services:
  - type: web
    name: diary-backend
    runtime: docker
    plan: free
    dockerfilePath: ./diary-backend/Dockerfile
    dockerContext: ./diary-backend
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_GROQ_API_KEY
        sync: false
      - key: APP_CORS_ALLOWED_ORIGIN
        sync: false
