# ---- Server ----
server.port=${PORT:8081}

# ---- Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/diary_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UT
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
app.jwt.secret=REPLACE_WITH_A_SECURE_RANDOM_SECRET

# ---- Groq AI ----
app.groq.api-key=YOUR_GROQ_API_KEY
app.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# ---- CORS ----
app.cors.allowed-origin=http://localhost:3000

# ---- Request size ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB